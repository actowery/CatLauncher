name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example v1.0.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@d4c94342e560b34958e3d8053fc90aafdc40bc19 # v5.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore CatLauncher.slnx --locked-mode
      - run: dotnet build Source/CatLauncher/CatLauncher.csproj -c Release --no-restore
      - run: pwsh ./scripts/validate-package.ps1 -RequireBinaries
      - run: pwsh ./scripts/package.ps1
      - run: gh release create "${{ inputs.tag }}" outputs/CatLauncher.zip outputs/CatLauncher.zip.sha256 --generate-notes --title "Cat Launcher ${{ inputs.tag }}"
        env:
          GH_TOKEN: ${{ github.token }}
