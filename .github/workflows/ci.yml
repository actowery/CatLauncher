name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.rimworld }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        rimworld: ["1.6", "1.7"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@d4c94342e560b34958e3d8053fc90aafdc40bc19 # v5.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore CatLauncher.slnx --locked-mode
      - run: dotnet build Source/CatLauncher/CatLauncher.csproj -c Release --no-restore
      - run: dotnet test Tests/CatLauncher.Tests/CatLauncher.Tests.csproj -c Release --no-restore /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura /p:CoverletOutput=../../TestResults/${{ matrix.rimworld }}/coverage
      - run: pwsh ./scripts/validate-package.ps1 -RequireBinaries
      - uses: codecov/codecov-action@18283e04ce6e1a6915a5b04980123d4e22d81be4 # v5.4.3
        if: matrix.rimworld == '1.7'
        with:
          files: TestResults/${{ matrix.rimworld }}/coverage.cobertura.xml
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CatLauncher-${{ matrix.rimworld }}
          path: ${{ matrix.rimworld }}/Assemblies/CatLauncher.dll
          if-no-files-found: error
